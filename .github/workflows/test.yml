name: Tests

# Guard the scripts/ test suite on every PR + push to main. The tests are plain
# Node + assert (no test framework, no node_modules) — each scripts/*.test.js
# file exits 1 on any failure, so we run them all and exit non-zero if any did.
# aiwatch#671 — NO path filter. It used to scope runs to `scripts/**` plus this one file, which meant
# a PR editing `generate-report.yml`'s action pins started no run at all: `ci-action-majors.test.js`
# guards the pins in EVERY workflow here, so it was green because it never executed.
#
# Widening the filter to `.github/workflows/**` fixed that, and a test then pinned the filter so it
# could not narrow back — but that test had to read YAML, and this repo is dependency-free by design
# (see the package.json check below), so it was a hand-written parser. Three review rounds each found
# another shape it read wrong: a deeper list indent, a flow-style `paths:`, a comment between entries.
# Each was a FALSE RED — the filter was present and correct, and CI said it was missing.
# Deleting the filter deletes the parser, the assertion, and that whole class of failure at once
# (memory `feedback_pin_the_decision_not_the_spelling`: against a real language, a hand-written parser
# loses). The suite is 6 files of plain Node with no install step and runs in ~3s, so what the filter
# was saving is a few seconds on docs-only PRs — less than one round of this cost to get wrong.

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs when a newer commit lands on the same ref — saves CI
# minutes on rapid push sequences (rebase / force-with-lease re-runs).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: scripts/*.test.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify no node_modules dependency drift
        # The repo intentionally has no package.json — tests are pure Node + assert.
        # Catch a future "let's add jest" accident at the CI layer so the no-deps
        # constraint stays explicit.
        run: |
          if [ -f package.json ]; then
            echo "::error::package.json present — this repo is dependency-free by design (refs aiwatch-reports#4 review). Drop it or update this workflow."
            exit 1
          fi

      - name: Run all scripts/*.test.js
        # Loop so every file reports independently in the log; track the worst
        # exit code so a failure in any file fails the job. `::group::` puts each
        # file's output in a collapsible block on the Actions UI.
        run: |
          set +e
          worst=0
          for t in scripts/*.test.js; do
            echo "::group::$t"
            node "$t"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error file=$t::tests failed (exit $code)"
              worst=$code
            fi
          done
          exit "$worst"
