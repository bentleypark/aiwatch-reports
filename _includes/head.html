<head>
  <script>
  // #264: reports moved to ai-watch.dev/reports/. Subdomain visitors bounce
  // to the canonical main-domain URL so SEO consolidates and internal links
  // (which now use baseurl=/reports) resolve correctly. Placed first so it
  // fires before CSS/asset loading and GA4 — redirect happens immediately.
  if (location.hostname === 'reports.ai-watch.dev') {
    location.replace('https://ai-watch.dev/reports' + location.pathname + location.search + location.hash);
  }
  </script>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {%- feed_meta -%}
  <link rel="icon" type="image/png" href="{{ '/assets/logo.png' | relative_url }}">
  <!-- GA4 — Hand-synced byte-for-byte with consentInitScript() from
       api/_shared/consent-init.ts in the main repo (Jekyll cannot import TS). gtag.js is
       loaded only when the stored aiwatch-cookie-consent value is 'granted', on load or from
       the banner's Accept All (aiwatch#2070); the key is shared with the SPA (#352). When the
       value is anything else, nothing is requested from Google, and any legacy `_ga`/`_gid`/`_gcl_au`
       cookies are cleared. The `bentleypark.github.io/aiwatch-reports/*` direct-access path runs
       on a different origin so SPA-set consent isn't readable there; that surface loads nothing
       until consent is given on the GH Pages origin itself. -->
  <script>(function(){var w=window,s=document.currentScript,nonce=s&&s.nonce;w.aiwatchStartAnalytics=function(){w.dataLayer=w.dataLayer||[];w.gtag=function(){w.dataLayer.push(arguments);};w.gtag('js',new Date());w.gtag('consent','default',{analytics_storage:'denied',ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied'});w.gtag('consent','update',{analytics_storage:'granted'});w.gtag('config','G-D4ZWVHQ7JK');var t=document.createElement('script');t.async=true;t.src='https://www.googletagmanager.com/gtag/js?id=G-D4ZWVHQ7JK';if(nonce)t.nonce=nonce;document.head.appendChild(t);};var c='';try{c=localStorage.getItem('aiwatch-cookie-consent');}catch(err){}if(c==='granted'){w.aiwatchStartAnalytics();}else{var h=location.hostname,EXP='expires=Thu, 01 Jan 1970 00:00:00 GMT';document.cookie.split(';').forEach(function(x){var n=x.split('=')[0].trim();if(n.indexOf('_ga')===0||n.indexOf('_gid')===0||n.indexOf('_gcl_au')===0||n==='_clck'||n==='_clsk'){document.cookie=n+'=;'+EXP+';path=/;domain=.'+h+';SameSite=Lax';document.cookie=n+'=;'+EXP+';path=/;domain='+h+';SameSite=Lax';document.cookie=n+'=;'+EXP+';path=/;SameSite=Lax';}});}})();</script>
</head>
